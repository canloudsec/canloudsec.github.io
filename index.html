<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>canloudsec // Profile</title>
    <style>
        :root {
            --bg-dark: #07090e;
            --card-bg: rgba(13, 17, 26, 0.85);
            --cyan-glow: #00f2fe;
            --purple-glow: #7000ff;
            --pink-glow: #ff007f;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --font-main: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
            --font-code: 'JetBrains Mono', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            cursor: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: var(--font-main);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* --- Canlı Arka Plan --- */
        body::before {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(112, 0, 255, 0.25) 0%, rgba(0, 242, 254, 0.15) 50%, transparent 80%);
            filter: blur(80px);
            border-radius: 50%;
            pointer-events: none;
            animation: pulse-glow 8s infinite alternate ease-in-out;
        }

        @keyframes pulse-glow {
            0% { transform: scale(1) translate(-10%, -10%); }
            100% { transform: scale(1.2) translate(10%, 10%); }
        }

        /* --- Custom Cursor --- */
        #cursor-dot, #cursor-outline {
            position: fixed;
            top: 0;
            left: 0;
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            transition: width 0.2s, height 0.2s, border-color 0.2s, background-color 0.2s, box-shadow 0.2s;
        }

        #cursor-dot {
            width: 6px;
            height: 6px;
            background-color: var(--cyan-glow);
            box-shadow: 0 0 10px var(--cyan-glow);
        }

        #cursor-outline {
            width: 30px;
            height: 30px;
            border: 1px solid rgba(0, 242, 254, 0.5);
            z-index: 9998;
        }

        body.hovering #cursor-dot {
            width: 10px;
            height: 10px;
            background-color: var(--pink-glow);
            box-shadow: 0 0 12px var(--pink-glow);
        }

        body.hovering #cursor-outline {
            width: 46px;
            height: 46px;
            border-color: var(--pink-glow);
            background: rgba(255, 0, 127, 0.08);
        }

        /* --- Cyber/Modern Card --- */
        .card {
            position: relative;
            width: 90%;
            max-width: 520px;
            padding: 40px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6),
                        0 0 40px rgba(112, 0, 255, 0.15);
            transition: transform 0.15s ease-out, border-color 0.3s ease, box-shadow 0.3s ease;
            overflow: hidden;
        }

        /* Scanline Deseni */
        .card::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px;
            pointer-events: none;
            opacity: 0.3;
        }

        .card:hover {
            border-color: rgba(0, 242, 254, 0.4);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7),
                        0 0 50px rgba(0, 242, 254, 0.25);
        }

        /* Header */
        .header {
            margin-bottom: 32px;
        }

        .header h1 {
            font-size: 2.2em;
            font-weight: 800;
            font-family: var(--font-code);
            background: linear-gradient(135deg, var(--cyan-glow) 0%, var(--purple-glow) 50%, var(--pink-glow) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
            filter: drop-shadow(0 2px 10px rgba(112, 0, 255, 0.3));
        }

        .header .subtitle {
            color: var(--text-muted);
            font-size: 0.88em;
            margin-top: 6px;
            font-family: var(--font-code);
            letter-spacing: 0.5px;
        }

        /* Info List */
        .info-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding: 24px 0;
            margin-bottom: 28px;
            position: relative;
            z-index: 2;
        }

        .info-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9em;
        }

        .info-item .label {
            color: var(--cyan-glow);
            font-family: var(--font-code);
            font-size: 0.85em;
            opacity: 0.9;
        }

        .info-item .value {
            color: var(--text-main);
            font-weight: 500;
        }

        /* Skills */
        .skills-section {
            margin-bottom: 32px;
            position: relative;
            z-index: 2;
        }

        .skills-title {
            font-size: 0.75em;
            color: var(--text-muted);
            font-family: var(--font-code);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }

        .skills-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .tag {
            background: rgba(112, 0, 255, 0.12);
            color: #d8b4fe;
            border: 1px solid rgba(112, 0, 255, 0.3);
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 0.8em;
            font-family: var(--font-code);
            transition: all 0.25s ease;
        }

        .tag:hover {
            border-color: var(--pink-glow);
            color: var(--pink-glow);
            background: rgba(255, 0, 127, 0.15);
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.3);
            transform: translateY(-2px);
        }

        /* Actions */
        .actions {
            position: relative;
            z-index: 2;
        }

        .btn-github {
            display: block;
            width: 100%;
            text-align: center;
            padding: 14px;
            color: #000;
            background: linear-gradient(135deg, var(--cyan-glow), #4facfe);
            font-weight: 700;
            font-family: var(--font-code);
            font-size: 0.88em;
            text-decoration: none;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 242, 254, 0.3);
            transition: all 0.25s ease;
        }

        .btn-github:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(0, 242, 254, 0.5);
            filter: brightness(1.1);
        }

        /* Footer */
        .footer {
            margin-top: 24px;
            font-size: 0.75em;
            color: var(--text-muted);
            font-family: var(--font-code);
            display: flex;
            justify-content: flex-end;
            align-items: center;
            position: relative;
            z-index: 2;
        }
    </style>
</head>
<body>

    <div id="cursor-dot"></div>
    <div id="cursor-outline"></div>

    <div class="card" id="interactive-card">
        <div class="header">
            <h1>canloudsec</h1>
            <div class="subtitle">Network Analyser & Pentester</div>
        </div>

        <div class="info-list">
            <div class="info-item">
                <span class="label">Durum</span>
                <span class="value">OSCP+ Sınavına Hazırlanıyor</span>
            </div>
            <div class="info-item">
                <span class="label">Konum</span>
                <span class="value">Antalya</span>
            </div>
            <div class="info-item">
                <span class="label">Uzmanlık</span>
                <span class="value">Port Tarama, Linux, Sistem Analizi</span>
            </div>
            <div class="info-item">
                <span class="label">Odak</span>
                <span class="value">Ağ Protokolleri & Savunma Mimarileri</span>
            </div>
        </div>

        <div class="skills-section">
            <div class="skills-title">Uzmanlık Alanları</div>
            <div class="skills-container">
                <span class="tag interactive-hover">Linux</span>
                <span class="tag interactive-hover">Pentesting</span>
                <span class="tag interactive-hover">Ağ Taraması</span>
                <span class="tag interactive-hover">Log Analizi</span>
                <span class="tag interactive-hover">CTF</span>
            </div>
        </div>

        <div class="actions">
            <a href="https://github.com/canloudsec" target="_blank" class="btn-github interactive-hover">GitHub Profilini İncele</a>
        </div>

        <div class="footer">
            <div id="live-clock">00:00:00</div>
        </div>
    </div>

    <script>
        const cursorDot = document.getElementById("cursor-dot");
        const cursorOutline = document.getElementById("cursor-outline");
        let mouseX = 0, mouseY = 0;
        let outlineX = 0, outlineY = 0;

        window.addEventListener("mousemove", (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
            cursorDot.style.left = `${mouseX}px`;
            cursorDot.style.top = `${mouseY}px`;
        });

        function animateCursor() {
            outlineX += (mouseX - outlineX) * 0.22;
            outlineY += (mouseY - outlineY) * 0.22;
            cursorOutline.style.left = `${outlineX}px`;
            cursorOutline.style.top = `${outlineY}px`;
            requestAnimationFrame(animateCursor);
        }
        animateCursor();

        const interactives = document.querySelectorAll('.interactive-hover, a, .tag');
        interactives.forEach(el => {
            el.addEventListener('mouseenter', () => document.body.classList.add('hovering'));
            el.addEventListener('mouseleave', () => document.body.classList.remove('hovering'));
        });

        const card = document.getElementById('interactive-card');
        card.addEventListener('mousemove', (e) => {
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            const rotateX = ((y - rect.height / 2) / 35).toFixed(2);
            const rotateY = (((rect.width / 2) - x) / 35).toFixed(2);

            card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
        });

        card.addEventListener('mouseleave', () => {
            card.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg)';
        });

        function updateClock() {
            const now = new Date();
            document.getElementById('live-clock').textContent = now.toTimeString().split(' ')[0];
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
